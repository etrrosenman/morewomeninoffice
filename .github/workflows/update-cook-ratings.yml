name: Update Cook ratings

on:
  schedule:
    # Mondays at 7:15–8:15 a.m. Pacific, depending on daylight saving time.
    - cron: '15 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test updater
        run: python -m unittest scripts/test_update_cook_ratings.py
      - name: Refresh ratings
        run: python scripts/update_cook_ratings.py
      - name: Commit changed ratings
        run: |
          if git diff --quiet -- public/data; then
            echo "No Cook rating changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update Cook rating snapshot"
          git push
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
